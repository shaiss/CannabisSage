name: Chrome Web Store Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Upload only, or upload and submit for review"
        required: true
        type: choice
        options:
          - submit-for-review
          - upload-only
        default: submit-for-review
      dry_run:
        description: "Auth check only; do not upload or submit"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # environment: cws-production  # awaiting Shai's decision before enabling GitHub Environment protection
    steps:
      - name: Checkout
        # Pin to actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # On a tag push, github.sha is the commit that tag pointed at when
          # this run was created. Check out that commit, not the tag ref.
          ref: ${{ github.sha }}

      # Fail closed for workflow_dispatch (and any other trigger) off a v* tag
      # before pack/upload/publish can run.
      - name: Require v* tag ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "${REF}" in
            refs/tags/v*)
              echo "Ref ${REF} is a v* tag"
              ;;
            *)
              echo "error: refusing to publish: github.ref must start with refs/tags/v (got '${REF}')" >&2
              exit 1
              ;;
          esac

      - name: Verify HEAD is the tag commit
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          if [[ "${HEAD}" != "${GITHUB_SHA}" ]]; then
            echo "error: HEAD '${HEAD}' != tag commit '${GITHUB_SHA}'" >&2
            exit 1
          fi
          echo "HEAD ${HEAD} matches tag commit ${GITHUB_SHA}"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          EXPECTED="v${VERSION}"
          if [[ "${TAG}" != "${EXPECTED}" ]]; then
            echo "error: git tag '${TAG}' does not match extension/manifest.json version '${EXPECTED}'" >&2
            exit 1
          fi
          echo "Tag ${TAG} matches manifest version ${VERSION}"

      - name: Check required secrets
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_SERVICE_ACCOUNT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CWS_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CWS_EXTENSION_ID}" ]] || missing+=("CWS_EXTENSION_ID")
          [[ -n "${CWS_PUBLISHER_ID}" ]] || missing+=("CWS_PUBLISHER_ID")
          [[ -n "${CWS_SERVICE_ACCOUNT_EMAIL}" ]] || missing+=("CWS_SERVICE_ACCOUNT_EMAIL")
          [[ -n "${CWS_SERVICE_ACCOUNT_PRIVATE_KEY}" ]] || missing+=("CWS_SERVICE_ACCOUNT_PRIVATE_KEY")
          if ((${#missing[@]} > 0)); then
            echo "error: missing required GitHub Actions secrets: ${missing[*]}" >&2
            echo "See docs/CWS-PUBLISHING.md for one-time owner setup. The workflow is inert until these are set." >&2
            exit 1
          fi
          echo "All required CWS secrets are present"

      - name: Setup Node.js
        # Pin to actions/setup-node@v4.2.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/cws-publish/package-lock.json

      - name: Install publish-browser-extension
        # Integrity-verified install from committed lockfile (not bare npx).
        # See docs/CWS-PUBLISHING.md § Tooling pin.
        working-directory: .github/cws-publish
        run: npm ci

      - name: Pack extension
        run: ./scripts/pack-extension.sh

      - name: Log zip and per-entry sha256
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ZIP="dist/cannabis-sage-${VERSION}.zip"
          if [[ ! -f "${ZIP}" ]]; then
            echo "error: expected pack output missing: ${ZIP}" >&2
            exit 1
          fi
          HASH_LIST="dist/cannabis-sage-${VERSION}.sha256"
          TMP="$(mktemp -d)"
          unzip -q "${ZIP}" -d "${TMP}/unpacked"
          unzip -Z1 "${ZIP}" | sort > "${TMP}/zip-entries.txt"
          echo "whole-zip sha256:"
          sha256sum "${ZIP}" | tee "${HASH_LIST}"
          echo "per-entry sha256, sorted by path:"
          python3 - "${TMP}/unpacked" "${TMP}/zip-entries.txt" << 'PY' | tee -a "${HASH_LIST}"
          import hashlib
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          listed = Path(sys.argv[2]).read_text().splitlines()
          rows = []
          for path in root.rglob("*"):
              rel = path.relative_to(root).as_posix()
              if path.is_dir():
                  rel += "/"
                  data = b""
              elif path.is_file():
                  data = path.read_bytes()
              else:
                  continue
              rows.append((rel, hashlib.sha256(data).hexdigest()))
          rows.sort(key=lambda row: row[0])
          got = [rel for rel, _digest in rows]
          if got != sorted(listed):
              missing = sorted(set(listed) - set(got))
              extra = sorted(set(got) - set(listed))
              print(f"error: hashed entries do not match zip entries; missing={missing} extra={extra}", file=sys.stderr)
              sys.exit(1)
          for rel, digest in rows:
              print(f"{digest}  {rel}")
          PY

      - name: Upload zip and per-entry hashes
        # Pin to actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cws-zip-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Publish to Chrome Web Store
        env:
          CHROME_API_VERSION: "v2"
          CHROME_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CWS_SERVICE_ACCOUNT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_PRIVATE_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'submit-for-review' }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          ZIP="dist/cannabis-sage-${VERSION}.zip"
          if [[ ! -f "${ZIP}" ]]; then
            echo "error: expected pack output missing: ${ZIP}" >&2
            exit 1
          fi
          export CHROME_ZIP="${ZIP}"

          if [[ "${MODE}" == "upload-only" ]]; then
            export CHROME_SKIP_SUBMIT_REVIEW=true
            echo "Mode: upload-only (skip submit for review)"
          else
            echo "Mode: submit-for-review"
          fi

          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            export DRY_RUN=true
            echo "Dry run enabled (auth check only)"
          fi

          # Run the locally installed binary from .github/cws-publish (npm ci above).
          # Env vars map to CLI flags: CHROME_* / DRY_RUN (see package config reference).
          ".github/cws-publish/node_modules/.bin/publish-extension"
